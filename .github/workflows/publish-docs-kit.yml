name: Publish Docs Kit

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docs Kit version to publish. Defaults to packages/docs-kit/package.json."
        required: false
        type: string
      dry_run:
        description: "Run npm publish --dry-run only."
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "docs-kit-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Dedicated environment so the docs-kit publisher stays separate from
    # regular CI, and npm's trusted-publisher entry can bind to it by name.
    environment: npm-docs-kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm with staged-publishing support
        run: |
          # `npm stage publish` (staged publishing, maintainer confirms the
          # version on npmjs.com before it goes live) requires npm 12.
          npm install -g npm@^12
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/docs-kit/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            requested="${GITHUB_REF_NAME#docs-kit-v}"
          elif [[ -n "${REQUESTED_VERSION:-}" ]]; then
            requested="${REQUESTED_VERSION}"
          else
            requested="${package_version}"
          fi
          if [[ "${requested}" != "${package_version}" ]]; then
            echo "Requested version ${requested} does not match packages/docs-kit/package.json ${package_version}" >&2
            exit 1
          fi
          echo "value=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Test Docs Kit
        run: pnpm --filter @botiverse/docs-kit test

      - name: Pack check
        working-directory: packages/docs-kit
        run: npm pack --dry-run

      - name: Stage dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: packages/docs-kit
        run: npm stage publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage for publishing
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        working-directory: packages/docs-kit
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RESOLVED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "### Docs Kit publish"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Package | \`@botiverse/docs-kit\` |"
            echo "| Version | \`${RESOLVED_VERSION}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
