name: i18n coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    name: Generate coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Scan translation coverage
        run: pnpm check:i18n-coverage > i18n-coverage.md
      - name: Add report to job summary
        run: cat i18n-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: i18n-coverage
          path: i18n-coverage.md
      - name: Enforce complete bilingual coverage
        run: pnpm check:i18n-coverage -- --check
